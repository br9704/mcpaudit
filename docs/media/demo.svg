<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 541" width="860" height="541" role="img" aria-labelledby="t">
  <title id="t">mcpaudit auditing @modelcontextprotocol/server-everything: 1 warn, 1 info, 4 checks skipped as not applicable</title>
  <style>
    .l { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 12.5px; }
    .t { fill: #c9d1d9; }
    .d { fill: #6e7681; }
    .h { fill: #e6edf3; font-weight: 700; }
    .w { fill: #d29922; font-weight: 700; }
    .i { fill: #58a6ff; font-weight: 700; }
    .r { fill: #30363d; }
    .p { fill: #57ab5a; }
    .f { fill: #6e7681; font-style: italic; }
    .bar { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 11.5px; fill: #6e7681; }
  </style>
  <rect x="0" y="0" width="860" height="541" rx="10" ry="10" fill="#0d1117"/>
  <path d="M0 10 A10 10 0 0 1 10 0 H850 A10 10 0 0 1 860 10 V34 H0 Z" fill="#161b22"/>
  <line x1="0" y1="34" x2="860" y2="34" stroke="#21262d" stroke-width="1"/>
  <circle cx="20" cy="17" r="5" fill="#3f4650"/>
  <circle cx="38" cy="17" r="5" fill="#3f4650"/>
  <circle cx="56" cy="17" r="5" fill="#3f4650"/>
  <text class="bar" x="430" y="21" text-anchor="middle">mcpaudit</text>
  <rect x="0.5" y="0.5" width="859" height="540" rx="10" ry="10" fill="none" stroke="#21262d" stroke-width="1"/>
  <text class="l" x="26" y="56" xml:space="preserve"><tspan class="p">$ </tspan><tspan class="t">npx @aethereumdev/mcp-audit "npx -y @modelcontextprotocol/server-everything"</tspan></text>
  <text class="l" x="26" y="90" xml:space="preserve"><tspan class="h">mcpaudit</tspan><tspan class="d"> | </tspan><tspan class="t">v0.1.0</tspan><tspan class="d"> | </tspan><tspan class="t">npx -y @modelcontextprotocol/server-everything</tspan></text>
  <text class="l" x="26" y="107" xml:space="preserve"><tspan class="h">server-everything</tspan><tspan class="d"> | </tspan><tspan class="t">v2.0.0</tspan><tspan class="d"> | </tspan><tspan class="t">protocol: pre-2026 handshake · 2025-11-25</tspan></text>
  <text class="l" x="26" y="124" xml:space="preserve"><tspan class="r">────────────────────────────────────────────────────────────────────────────</tspan></text>
  <text class="l" x="26" y="158" xml:space="preserve"><tspan class="h">Lane A · conformance</tspan></text>
  <text class="l" x="26" y="192" xml:space="preserve"><tspan class="t">  </tspan><tspan class="w">WARN</tspan><tspan class="d"> | </tspan><tspan class="t">Server answered tools/list before any initialize handshake</tspan><tspan class="d"> | </tspan><tspan class="d">C8_ANSWERS_BEFORE_INITIALIZE</tspan></text>
  <text class="l" x="26" y="209" xml:space="preserve"><tspan class="t">      On a fresh connection, with no initialize sent, this server returned a</tspan></text>
  <text class="l" x="26" y="226" xml:space="preserve"><tspan class="t">      full tools/list. A client that supports both eras can therefore get a</tspan></text>
  <text class="l" x="26" y="243" xml:space="preserve"><tspan class="t">      legacy-semantics answer while believing it negotiated a modern version.</tspan></text>
  <text class="l" x="26" y="260" xml:space="preserve"><tspan class="d">      at:   </tspan><tspan class="t">tools/list (before initialize)</tspan></text>
  <text class="l" x="26" y="277" xml:space="preserve"><tspan class="d">      fix:  </tspan><tspan class="t">Reject requests that arrive before a successful initialize</tspan></text>
  <text class="l" x="26" y="294" xml:space="preserve"><tspan class="t">            handshake, or migrate to 2026-07-28 where every request carries</tspan></text>
  <text class="l" x="26" y="311" xml:space="preserve"><tspan class="t">            its own protocol version.</tspan></text>
  <text class="l" x="26" y="345" xml:space="preserve"><tspan class="t">  </tspan><tspan class="i">INFO</tspan><tspan class="d"> | </tspan><tspan class="t">Server speaks a pre-2026 revision (2025-11-25)</tspan><tspan class="d"> | </tspan><tspan class="d">C0_PRE_2026_PROTOCOL</tspan></text>
  <text class="l" x="26" y="379" xml:space="preserve"><tspan class="d">Skipped (4) — not applicable to this server:</tspan></text>
  <text class="l" x="26" y="396" xml:space="preserve"><tspan class="d">  C1_DISCOVER</tspan><tspan class="d"> — applies to modern servers; this one is legacy</tspan></text>
  <text class="l" x="26" y="413" xml:space="preserve"><tspan class="d">  C3_META_VALIDATION</tspan><tspan class="d"> — applies to modern servers; this one is legacy</tspan></text>
  <text class="l" x="26" y="430" xml:space="preserve"><tspan class="d">  C7_HTTP_HEADERS</tspan><tspan class="d"> — applies to modern servers; this one is legacy</tspan></text>
  <text class="l" x="26" y="447" xml:space="preserve"><tspan class="d">  S5_CROSS_SERVER_SHADOWING</tspan><tspan class="d"> — needs more than one target; pass several servers in one run</tspan></text>
  <text class="l" x="26" y="481" xml:space="preserve"><tspan class="r">────────────────────────────────────────────────────────────────────────────</tspan></text>
  <text class="l" x="26" y="498" xml:space="preserve"><tspan class="t">1 warn, 1 info</tspan><tspan class="d"> | </tspan><tspan class="t">10 passed</tspan><tspan class="d"> | </tspan><tspan class="t">2 failed</tspan><tspan class="d"> | </tspan><tspan class="t">4 skipped</tspan><tspan class="d"> | </tspan><tspan class="t">4.8s</tspan></text>
  <text class="l" x="26" y="515" xml:space="preserve"><tspan class="f">a first-pass linter that catches common issues — not a security audit.</tspan></text>
</svg>
